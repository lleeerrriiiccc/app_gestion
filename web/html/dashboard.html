<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard - App Gestión</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="layout">
        <aside>
            <div class="brand">App Gestión</div>
            <input id="filter" class="search" placeholder="Filtrar menú..." />
            <nav style="margin-top:12px">
                <ul id="menu" class="menu">
                    <!-- Enlaces se generan con JS -->
                </ul>
            </nav>
            <div style="position:relative;bottom:0;margin-top:18px;font-size:13px;color:rgba(255,255,255,0.8)">
                Versión sencilla · Dashboard
            </div>
        </aside>

        <main>
            <header class="app-header">
                <div class="brand-left">
                    <div class="logo" aria-hidden="true">
                        <img src="/img/logo.png" alt="Logo" style="width:24px;height:24px">
                    </div>
                    <div class="enterprise-name">SUIMCO</div>
                </div>
                <div style="display:flex;align-items:center;gap:12px">
                    <div class="small" id="status">Estado</div>
                    <a href="/logout" class="logout-btn">Cerrar sesión</a>
                </div>
            </header>
        </main>
    </div>

    <script>
    (function(){
        const menuEl = document.getElementById('menu');
        const filterInput = document.getElementById('filter');
        const statusEl = document.getElementById('status');

        let menuData = [];

        async function loadMenu(){
            statusEl.textContent = 'Cargando menú...';
            try{
                const res = await fetch('/menu', {cache:'no-store', headers: {"Content-Type": "application/json; charset=utf-8"}});
                if(!res.ok) throw new Error('No menu.json');
                const data = await res.json();

                // Normalize into array of groups {group, items: [{name, href}] }
                if(Array.isArray(data)){
                    menuData = [{ group: 'Menu', items: data.map(it => ({ name: it.name, href: it.href })) }];
                } else if(data && typeof data === 'object'){
                    menuData = Object.entries(data).map(([k,v]) => ({ group: k, items: Array.isArray(v) ? v.map(it=>({name: it.name, href: it.href})) : [] }));
                } else {
                    menuData = [];
                }

                renderMenu();
                fetch('/api/me').then(r=>r.json()).then(user=>{
                    statusEl.textContent = `Conectado como ${user.user || user.name || 'desconocido'}`;
                });
            }catch(err){
                console.error(err);
                menuEl.innerHTML = '<li class="empty">No se pudo cargar el menú.</li>';
                statusEl.textContent = 'Error cargando menú';
            }
        }

        function renderMenu(){
            menuEl.innerHTML = '';
            if(!menuData || menuData.length===0){
                menuEl.innerHTML = '<li class="empty">No hay elementos de menú.</li>';
                return;
            }

            const frag = document.createDocumentFragment();
            menuData.forEach(group => {
                const li = document.createElement('li');
                li.className = 'has-submenu';

                const toggle = document.createElement('div');
                toggle.className = 'submenu-toggle';
                toggle.textContent = group.group;
                const chevr = document.createElement('span'); chevr.textContent = '\u25BC';
                toggle.appendChild(chevr);
                li.appendChild(toggle);

                const submenu = document.createElement('div');
                submenu.className = 'submenu';
                (group.items||[]).forEach(it => {
                    const a = document.createElement('a');
                    a.href = it.href || '#';
                    a.textContent = it.name || it.href || '-';
                    submenu.appendChild(a);
                });
                li.appendChild(submenu);
                frag.appendChild(li);
            });

            menuEl.appendChild(frag);

            // attach toggles
            document.querySelectorAll('.menu .has-submenu .submenu-toggle').forEach(el=>{
                el.addEventListener('click', ()=> el.parentElement.classList.toggle('open'));
            });

            // highlight on link click
            menuEl.addEventListener('click', (e)=>{
                const a = e.target.closest('a');
                if(!a) return;
                menuEl.querySelectorAll('a').forEach(x=>x.classList.remove('active'));
                a.classList.add('active');
            });

            applyFilter();
        }

        function applyFilter(){
            const q = (filterInput.value||'').trim().toLowerCase();
            const lis = Array.from(menuEl.querySelectorAll(':scope > li'));
            let visible = 0;
            lis.forEach(li=>{
                const title = (li.querySelector('.submenu-toggle')?.textContent || '').toLowerCase();
                const links = Array.from(li.querySelectorAll('.submenu a'));
                const childMatch = links.some(a=> (a.textContent||'').toLowerCase().includes(q));
                const groupMatch = title.includes(q);
                const ok = q === '' || childMatch || groupMatch;
                li.style.display = ok ? '' : 'none';
                if(ok) visible++;
            });
            const totalLinks = menuEl.querySelectorAll('.submenu a').length;
            statusEl.textContent = `${visible} grupos — ${totalLinks} enlaces`;
        }

        // debounce
        function debounce(fn, ms=150){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); } }

        filterInput.addEventListener('input', debounce(applyFilter, 120));

        // init
        loadMenu();
    })();
    </script>

</body>
</html>
