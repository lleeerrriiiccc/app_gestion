<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Usuarios — Nuevo usuario</title>
    <style>
        :root{
            --bg:#f3f7fb;
            --card:#fff;
            --accent:#2563eb;
            --muted:#6b7280;
            --success:#10b981;
        }
        html,body{height:100%}
        body{
            margin:0;
            font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
            background:linear-gradient(180deg,#eef6ff 0%,var(--bg) 100%);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            color:#111827;
        }
        .card{
            width:100%;
            max-width:520px;
            background:var(--card);
            border-radius:12px;
            box-shadow:0 6px 24px rgba(15,23,42,0.08);
            padding:24px 28px;
        }
        .module-header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
        .badge{
            background:linear-gradient(90deg, rgba(37,99,235,0.12), rgba(37,99,235,0.06));
            color:var(--accent);
            font-weight:600;
            font-size:12px;
            padding:6px 10px;
            border-radius:999px;
        }
        h1{font-size:18px;margin:0 0 6px}
        p.lead{margin:0 0 14px;color:var(--muted);font-size:13px}
        form{display:grid;gap:12px}
        label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
        input[type="text"],input[type="password"],select{
            width:100%;
            box-sizing:border-box;
            padding:10px 12px;
            border:1px solid #e6e9ee;
            border-radius:8px;
            background:#fff;
            font-size:14px;
            color:#111827;
            outline:none;
            transition:box-shadow .12s, border-color .12s;
        }
        input:focus{border-color:var(--accent);box-shadow:0 6px 18px rgba(37,99,235,0.08)}
        .hint{font-size:12px;color:var(--muted);margin-top:6px}
        .actions{display:flex;gap:10px;align-items:center;margin-top:6px}
        button.primary{
            background:var(--accent);
            color:#fff;border:0;padding:10px 14px;border-radius:8px;
            cursor:pointer;font-weight:600;
            box-shadow:0 6px 18px rgba(37,99,235,0.12);
        }
        button.ghost{background:transparent;border:1px solid #e6e9ee;padding:10px 12px;border-radius:8px;cursor:pointer}
        .small{font-size:13px;color:var(--muted)}
        .error{color:#ef4444;font-size:13px}
        .success{color:var(--success);font-size:13px}
    </style>
</head>
<body>
    <main class="card" role="main">
        <div class="module-header" aria-hidden="false">
            <div class="badge">Módulo Usuarios</div>
            <div style="font-size:13px;color:var(--muted)">Gestión · Crear nuevo</div>
        </div>

        <h1>Crear nuevo usuario</h1>
        <p class="lead">Utiliza este módulo para añadir usuarios al sistema de gestión. Los campos requeridos son usuario y contraseña.</p>

        <form id="loginForm" action="http://127.0.0.1:5000/register" method="post" novalidate>
            <div>
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" required autocomplete="username" placeholder="tu_usuario">
            </div>

            <div>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Al menos 8 caracteres">
            </div>

            <div class="actions">
                <button type="submit" class="primary">Crear usuario</button>
                <button type="reset" class="ghost">Cancelar</button>
            </div>

            <div id="message" role="status" aria-live="polite"></div>
        </form>
    </main>

    <script>
        (function(){
            const form = document.getElementById('loginForm');
            const msg = document.getElementById('message');
            const submitBtn = form.querySelector('button[type="submit"]');

            function show(text, cls){
                msg.textContent = text;
                msg.className = cls;
            }

            form.addEventListener('submit', async function(e){
                e.preventDefault();
                show('', '');
                const user = form.username.value.trim();
                const pwd = form.password.value;

                if (!user) {
                    show('El usuario es obligatorio.', 'error');
                    form.username.focus();
                    return;
                }

                if (pwd.length < 8) {
                    show('La contraseña debe tener al menos 8 caracteres.', 'error');
                    form.password.focus();
                    return;
                }

                const url = 'http://127.0.0.1:5000/register';
                const body = new URLSearchParams(new FormData(form)).toString();

                submitBtn.disabled = true;
                show('Procesando…', 'small');

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                        body: body
                    });

                    const ct = res.headers.get('Content-Type') || '';
                    let data = ct.includes('application/json') ? await res.json() : await res.text();

                    if (res.ok) {
                        show(typeof data === 'string' ? data : (data.message || 'Usuario creado correctamente.'), 'success');
                        // form.reset(); // descomentar si quieres limpiar el formulario al crear el usuario
                    } else {
                        show(typeof data === 'string' ? data : (data.error || 'Error al crear el usuario.'), 'error');
                    }
                } catch (err) {
                    show('No se pudo conectar con el servidor.', 'error');
                    console.error(err);
                } finally {
                    submitBtn.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
