<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clientes — Listado</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>main{padding:24px}</style>
</head>
<body>
    <main class="card card--wide">
        <div class="module-header">
            <div class="badge">Clientes</div>
            <div class="small">Listado de clientes</div>
        </div>

        <section>
            <div class="form-inline">
                <label class="muted">Buscar</label>
                <input id="filterName" type="text" placeholder="Nombre cliente" />
                <button id="btnFilter" class="primary">Buscar</button>
                <button id="btnReload" class="ghost">Recargar</button>
            </div>
        </section>

        <section style="margin-top:12px">
            <div class="table-responsive">
            <table id="clientsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Contactos</th>
                        <th>Direcciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            </div>
        </section>

        <div id="message" role="status" aria-live="polite" style="margin-top:10px"></div>

        <div style="margin-top:12px">
            <button type="button" class="ghost" onclick="location.href='/dashboard'">Volver</button>
        </div>
    </main>

    <script>
        const tableBody = document.querySelector('#clientsTable tbody');
        const filterName = document.getElementById('filterName');
        const btnFilter = document.getElementById('btnFilter');
        const btnReload = document.getElementById('btnReload');
        const message = document.getElementById('message');

        function escapeHtml(s){ if (s === null || s === undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
        function escapeAttr(s){ if (s === null || s === undefined) return ''; return String(s).replace(/"/g,'&quot;'); }

        async function loadClients(){
            tableBody.innerHTML = '';
            message.textContent = '';
            try{
                const name = filterName.value.trim();
                const params = new URLSearchParams();
                if(name) params.set('name', name);
                // Endpoint expected: /api/clients?name=
                const res = await fetch('/api/clients?' + params.toString());
                if(!res.ok){ tableBody.innerHTML = '<tr><td colspan="4">Error cargando clientes</td></tr>'; return; }
                const rows = await res.json();
                renderTable(rows);
            }catch(e){ tableBody.innerHTML = '<tr><td colspan="4">No se pudieron cargar clientes</td></tr>'; }
        }

        function renderTable(rows){
            tableBody.innerHTML = '';
            if(!rows || rows.length===0){ tableBody.innerHTML = '<tr><td colspan="4">No hay clientes</td></tr>'; return; }
            rows.forEach(r=>{
                const id = r.idcliente || r.id || r.idCliente || '';
                const name = r.name || r.nombre || r.cliente || '';
                const email = r.email || '';
                const tr = document.createElement('tr');
                tr.innerHTML = `\n                    <td>${escapeHtml(id)}</td>\n                    <td>${escapeHtml(name)}</td>\n                    <td>${escapeHtml(email)}</td>\n                    <td><button class="ghost btn-contacts" data-id="${escapeAttr(id)}" data-name="${escapeAttr(name)}">Contactos ▾</button></td>\n                    <td><button class="ghost btn-addresses" data-id="${escapeAttr(id)}" data-name="${escapeAttr(name)}">Direcciones ▾</button></td>\n                `;
                tableBody.appendChild(tr);
            });
            // attach expand handlers
            tableBody.querySelectorAll('.btn-contacts').forEach(btn=> btn.addEventListener('click', (ev)=>{
                const id = btn.getAttribute('data-id');
                const name = btn.getAttribute('data-name');
                toggleContacts(btn, id, name);
            }));
        }

        // contacts cache to avoid refetching
        const contactsCache = new Map();

                function makeContactsRow(html){
                    const tr = document.createElement('tr');
                    tr.className = 'contacts-row';
                    const td = document.createElement('td');
                    // table now has 5 columns (ID, Nombre, Email, Contactos, Direcciones)
                    td.colSpan = 5;
                    td.innerHTML = html;
                    tr.appendChild(td);
                    return tr;
                }

        async function toggleContacts(btn, clientId, clientName){
            // find the parent row
            const row = btn.closest('tr');
            if(!row) return;
            // if next sibling is contacts-row -> remove it (collapse)
            const next = row.nextElementSibling;
            if(next && next.classList && next.classList.contains('contacts-row')){
                next.remove();
                return;
            }
            // create placeholder row
            const placeholder = makeContactsRow('<div style="padding:12px">Cargando contactos...</div>');
            row.parentNode.insertBefore(placeholder, row.nextSibling);

            // load from cache or fetch
            if(contactsCache.has(clientId)){
                const contacts = contactsCache.get(clientId);
                placeholder.firstChild.innerHTML = renderContactsList(contacts, clientId);
                attachAddContactHandler(placeholder, clientId);
                attachSaveContactsHandler(placeholder, clientId);
                return;
            }

            try{
                const res = await fetch('/api/contacts?client_id=' + encodeURIComponent(clientId));
                if(!res.ok){ placeholder.firstChild.innerHTML = '<div class="error">Error cargando contactos</div>'; return; }
                const rows = await res.json();
                contactsCache.set(clientId, rows);
                placeholder.firstChild.innerHTML = renderContactsList(rows, clientId);
                attachAddContactHandler(placeholder, clientId);
                attachSaveContactsHandler(placeholder, clientId);
            }catch(e){ placeholder.firstChild.innerHTML = '<div class="error">No se pudieron cargar contactos</div>'; }
        }

        function renderContactsList(rows, clientId){
            // include add-contact form at top
            let html = '<div style="margin-bottom:8px;padding:8px;border-radius:8px;background:linear-gradient(180deg,#fff,#fbfdff)">';
            html += '<div style="font-weight:600;margin-bottom:6px">Añadir contacto</div>';
            html += `<div style="display:flex;gap:8px;flex-wrap:wrap">`;
            html += `<input class="new-contact-name" placeholder="Nombre" style="flex:1;min-width:140px">`;
            html += `<input class="new-contact-email" placeholder="Email" style="flex:1;min-width:160px">`;
            html += `<input class="new-contact-tel" placeholder="Teléfono" style="width:140px">`;
            html += `<label class="small" style="align-self:center">Facturas</label>`;
            html += `<input type="checkbox" class="new-contact-facturas" style="width:140px">`;
            html += `<button class="primary add-contact-btn">Añadir</button>`;
            html += `</div></div>`;

            if(!rows || rows.length===0) return html + '<div class="small">No hay contactos</div>';
            html += '<div class="contacts-list" style="display:flex;flex-direction:column;gap:8px">';
            // Add a Save button for editing existing contacts
            html += `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
                        <button class="primary save-contacts-btn">Guardar cambios</button>
                        <span class="small muted save-hint">Edita los campos y pulsa Guardar cambios para persistirlos.</span>
                    </div>`;
            rows.forEach(c=>{
                const id = c.idcontacto || c.id || '';
                const name = c.name || c.nombre || '';
                const email = c.email || '';
                const tel = c.tel || c.telefono || '';
                const facturas = c.facturas ? 1 : 0;
                // render editable row (inputs) for each contact
                html += `<div class="contact-item" data-contact-id="${escapeAttr(id)}" style="padding:8px;border-radius:8px;background:#fff;display:flex;gap:12px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,0.04)">`;
                html += `<div style="min-width:36px;color:var(--muted);font-size:13px">${escapeHtml(id)}</div>`;
                html += `<div style="flex:1;display:flex;gap:8px;align-items:center">`;
                html += `<input class="contact-name" value="${escapeAttr(name)}" style="flex:1;min-width:140px">`;
                html += `<input class="contact-email" value="${escapeAttr(email)}" style="flex:1;min-width:160px">`;
                html += `<input class="contact-tel" value="${escapeAttr(tel)}" style="width:140px">`;
                html += `<label class="small" style="display:flex;align-items:center;gap:6px;margin-left:8px"><input type="checkbox" class="contact-facturas" ${facturas? 'checked' : ''}> Facturas</label>`;
                html += `</div>`;
                // delete button
                html += `<div style="min-width:70px;text-align:right"><button class="ghost delete-contact-btn" data-id="${escapeAttr(id)}">Eliminar</button></div>`;
                html += `</div>`;
            });
            html += '</div>';
            return html;
        }

        function attachAddContactHandler(placeholder, clientId){
            const addBtn = placeholder.firstChild.querySelector('.add-contact-btn');
            if(!addBtn) return;
            addBtn.addEventListener('click', async ()=>{
                const name = placeholder.firstChild.querySelector('.new-contact-name').value.trim();
                const email = placeholder.firstChild.querySelector('.new-contact-email').value.trim();
                const tel = placeholder.firstChild.querySelector('.new-contact-tel').value.trim();
                const facturas = placeholder.firstChild.querySelector('.new-contact-facturas').value.trim();
                if(!name){ alert('Nombre requerido'); return; }
                try{
                    const res = await fetch('/api/contacts/add', {
                        method:'POST',
                        headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
                        body: new URLSearchParams({client_id: clientId, name, email, tel, facturas: facturas ? 1 : 0}).toString()
                    });
                    const text = await res.text();
                    if(res.ok){
                        const r2 = await fetch('/api/contacts?client_id=' + encodeURIComponent(clientId));
                        const updated = await r2.json();
                        contactsCache.set(clientId, updated);
                        placeholder.firstChild.innerHTML = renderContactsList(updated, clientId);
                            attachAddContactHandler(placeholder, clientId);
                            attachSaveContactsHandler(placeholder, clientId);
                            attachDeleteContactHandler(placeholder, clientId);
                    } else { alert(text || 'Error'); }
                }catch(err){ alert('No se pudo conectar'); }
            });
        }

        // Attach handler to Save changes button to persist edits of existing contacts.
        function attachSaveContactsHandler(placeholder, clientId){
            const saveBtn = placeholder.firstChild.querySelector('.save-contacts-btn');
            if(!saveBtn) return;
            // avoid double-binding
            if(saveBtn.dataset.bound) return; saveBtn.dataset.bound = '1';
            saveBtn.addEventListener('click', async ()=>{
                const contactItems = Array.from(placeholder.firstChild.querySelectorAll('.contact-item'));
                if(contactItems.length === 0){ alert('No hay contactos para guardar'); return; }
                const updates = [];
                for(const item of contactItems){
                    const contactId = item.dataset.contactId || '';
                    const name = item.querySelector('.contact-name').value.trim();
                    const email = item.querySelector('.contact-email').value.trim();
                    const tel = item.querySelector('.contact-tel').value.trim();
                    const facturas = item.querySelector('.contact-facturas').checked ? 1 : 0;
                    if(!name){ alert('Nombre requerido para todos los contactos'); return; }
                    updates.push({contactId, name, email, tel, facturas});
                }

                const missingEndpoints = new Set();
                for(const u of updates){
                    try{
                        if(!u.contactId){
                            // new contact -> use existing add endpoint
                            const res = await fetch('/api/contacts/add', {
                                method:'POST',
                                headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
                                body: new URLSearchParams({client_id: clientId, name: u.name, email: u.email, tel: u.tel, facturas: u.facturas}).toString()
                            });
                            if(!res.ok){ const txt = await res.text(); alert('Error añadiendo contacto: ' + (txt||res.status)); return; }
                        } else {
                            // existing contact -> attempt update endpoint (likely missing server-side)
                            const res = await fetch('/api/contacts/update', {
                                method:'POST',
                                headers:{'Content-Type':'application/json;charset=UTF-8'},
                                body: JSON.stringify({id: u.contactId, client_id: clientId, name: u.name, email: u.email, tel: u.tel, facturas: u.facturas})
                            });
                            if(res.status === 404){ missingEndpoints.add('/api/contacts/update'); }
                            else if(!res.ok){ const txt = await res.text(); alert('Error actualizando contacto: ' + (txt||res.status)); return; }
                        }
                    }catch(err){ alert('Error de red al guardar contactos'); return; }
                }

                if(missingEndpoints.size>0){
                    placeholder.firstChild.insertAdjacentHTML('afterbegin', `<div class="error" style="margin-bottom:8px">El backend no dispone de los endpoints necesarios para actualizar contactos. Falta: ${Array.from(missingEndpoints).join(', ')}. Para finalizar la funcionalidad, crea un endpoint POST /api/contacts/update que acepte JSON {id, client_id, name, email, tel, facturas} y actualice la fila correspondiente en <code>datos_contacto</code>.</div>`);
                    return;
                }

                try{
                    const r2 = await fetch('/api/contacts?client_id=' + encodeURIComponent(clientId));
                    const updated = await r2.json();
                    contactsCache.set(clientId, updated);
                    placeholder.firstChild.innerHTML = renderContactsList(updated, clientId);
                    attachAddContactHandler(placeholder, clientId);
                    attachSaveContactsHandler(placeholder, clientId);
                    attachDeleteContactHandler(placeholder, clientId);
                }catch(err){ alert('No se pudo recargar la lista de contactos'); }
            });
        }

        // Attach delete handlers for contact delete buttons
        function attachDeleteContactHandler(placeholder, clientId){
            const delBtns = Array.from(placeholder.firstChild.querySelectorAll('.delete-contact-btn'));
            delBtns.forEach(btn=>{
                if(btn.dataset.bound) return; btn.dataset.bound = '1';
                btn.addEventListener('click', async ()=>{
                    const id = btn.getAttribute('data-id');
                    if(!id){ alert('ID de contacto inválido'); return; }
                    if(!confirm('¿Eliminar este contacto? Esta acción no se puede deshacer.')) return;
                    try{
                        const res = await fetch('/api/contacts/delete', {
                            method: 'POST',
                            headers: {'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
                            body: new URLSearchParams({id}).toString()
                        });
                        const txt = await res.text();
                        if(!res.ok){ alert('Error eliminando contacto: ' + (txt || res.status)); return; }
                        // reload contacts
                        const r2 = await fetch('/api/contacts?client_id=' + encodeURIComponent(clientId));
                        const updated = await r2.json();
                        contactsCache.set(clientId, updated);
                        placeholder.firstChild.innerHTML = renderContactsList(updated, clientId);
                        attachAddContactHandler(placeholder, clientId);
                        attachSaveContactsHandler(placeholder, clientId);
                        attachDeleteContactHandler(placeholder, clientId);
                    }catch(err){ alert('No se pudo conectar al servidor'); }
                });
            });
        }

        btnFilter.addEventListener('click', loadClients);
        btnReload.addEventListener('click', ()=>{ filterName.value=''; loadClients(); });

        // initial load
        loadClients();
        
        // Addresses (envio) cache + toggle
        const addressesCache = new Map();

        async function toggleAddresses(btn, clientId, clientName){
            const row = btn.closest('tr');
            if(!row) return;
            const next = row.nextElementSibling;
            if(next && next.classList && next.classList.contains('contacts-row')){ next.remove(); return; }
            const placeholder = makeContactsRow('<div style="padding:12px">Cargando direcciones...</div>');
            row.parentNode.insertBefore(placeholder, row.nextSibling);
            if(addressesCache.has(clientId)){
                placeholder.firstChild.innerHTML = renderAddressesList(addressesCache.get(clientId));
                attachAddAddressHandler(placeholder, clientId);
                attachSaveAddressesHandler(placeholder, clientId);
                return;
            }
            try{
                const res = await fetch('/api/addresses?client_id=' + encodeURIComponent(clientId));
                if(!res.ok){ placeholder.firstChild.innerHTML = '<div class="error">Error cargando direcciones</div>'; return; }
                const rows = await res.json();
                addressesCache.set(clientId, rows);
                placeholder.firstChild.innerHTML = renderAddressesList(rows);
                attachAddAddressHandler(placeholder, clientId);
                attachSaveAddressesHandler(placeholder, clientId);
            }catch(e){ placeholder.firstChild.innerHTML = '<div class="error">No se pudieron cargar direcciones</div>'; }
        }

        function renderAddressesList(rows){
            // include add-address form at top
            let html = '<div style="margin-bottom:8px;padding:8px;border-radius:8px;background:linear-gradient(180deg,#fff,#fbfdff)">';
            html += '<div style="font-weight:600;margin-bottom:6px">Añadir dirección de envío</div>';
            html += `<div style="display:flex;gap:8px;flex-wrap:wrap">`;
            html += `<input class="new-addr-direccion" placeholder="Dirección" style="flex:1;min-width:200px">`;
            html += `<input class="new-addr-poblacion" placeholder="Población" style="min-width:140px">`;
            html += `<input class="new-addr-cp" placeholder="C.P." style="width:100px">`;
            html += `<input class="new-addr-pais" placeholder="País" style="width:120px">`;
            html += `<button class="primary add-address-btn">Añadir</button>`;
            html += `</div></div>`;

            if(!rows || rows.length===0) return html + '<div class="small">No hay direcciones de envío</div>';
            // render editable address list with a Save button
            let listHtml = '<div class="addresses-list" style="display:flex;flex-direction:column;gap:8px">';
            listHtml += `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
                            <button class="primary save-addresses-btn">Guardar cambios</button>
                            <span class="small muted save-hint">Edita los campos y pulsa Guardar cambios para persistirlos.</span>
                        </div>`;
            rows.forEach(a=>{
                const id = a.idregistro || a.id || '';
                const poblacion = a.poblacion || a.city || '';
                const direccion = a.direccion || a.address || '';
                const cp = a.codigo_postal || a.codigo || '';
                const pais = a.pais || a.country || '';
                listHtml += `<div class="addr-item" data-addr-id="${escapeAttr(id)}" style="padding:8px;border-radius:8px;background:#fff;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 2px rgba(0,0,0,0.04)">`;
                listHtml += `<div style="min-width:36px;color:var(--muted);font-size:13px">${escapeHtml(id)}</div>`;
                listHtml += `<div style="flex:1;display:flex;flex-direction:column;gap:6px">`;
                listHtml += `<input class="addr-direccion" value="${escapeAttr(direccion)}" placeholder="Dirección" style="width:100%">`;
                listHtml += `<div style="display:flex;gap:8px">`;
                listHtml += `<input class="addr-poblacion" value="${escapeAttr(poblacion)}" placeholder="Población" style="flex:1">`;
                listHtml += `<input class="addr-cp" value="${escapeAttr(cp)}" placeholder="C.P." style="width:100px">`;
                listHtml += `<input class="addr-pais" value="${escapeAttr(pais)}" placeholder="País" style="width:120px">`;
                listHtml += `</div></div><div style="min-width:80px;text-align:right"><button class="ghost delete-addr-btn" data-id="${escapeAttr(id)}">Eliminar</button></div></div>`;
            });
            listHtml += '</div>';
            return html + listHtml;
        }

        function attachAddAddressHandler(placeholder, clientId){
            const addBtn = placeholder.firstChild.querySelector('.add-address-btn');
            if(!addBtn) return;
            addBtn.addEventListener('click', async ()=>{
                const direccion = placeholder.firstChild.querySelector('.new-addr-direccion').value.trim();
                const poblacion = placeholder.firstChild.querySelector('.new-addr-poblacion').value.trim();
                const codigo_postal = placeholder.firstChild.querySelector('.new-addr-cp').value.trim();
                const pais = placeholder.firstChild.querySelector('.new-addr-pais').value.trim();
                if(!direccion){ alert('Dirección requerida'); return; }
                try{
                    const res = await fetch('/api/addresses/add', {
                        method:'POST',
                        headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
                        body: new URLSearchParams({client_id: clientId, direccion, poblacion, codigo_postal, pais}).toString()
                    });
                    const text = await res.text();
                    if(res.ok){
                        const r2 = await fetch('/api/addresses?client_id=' + encodeURIComponent(clientId));
                        const updated = await r2.json();
                        addressesCache.set(clientId, updated);
                        placeholder.firstChild.innerHTML = renderAddressesList(updated);
                        attachAddAddressHandler(placeholder, clientId);
                        attachSaveAddressesHandler(placeholder, clientId);
                    } else { alert(text || 'Error'); }
                }catch(err){ alert('No se pudo conectar'); }
            });
        }

        // Attach handler to Save changes button to persist edits of existing addresses.
        function attachSaveAddressesHandler(placeholder, clientId){
            const saveBtn = placeholder.firstChild.querySelector('.save-addresses-btn');
            if(!saveBtn) return;
            if(saveBtn.dataset.bound) return; saveBtn.dataset.bound = '1';
            saveBtn.addEventListener('click', async ()=>{
                const addrItems = Array.from(placeholder.firstChild.querySelectorAll('.addr-item'));
                if(addrItems.length === 0){ alert('No hay direcciones para guardar'); return; }
                const updates = [];
                for(const item of addrItems){
                    const addrId = item.dataset.addrId || '';
                    const direccion = item.querySelector('.addr-direccion').value.trim();
                    const poblacion = item.querySelector('.addr-poblacion').value.trim();
                    const codigo_postal = item.querySelector('.addr-cp').value.trim();
                    const pais = item.querySelector('.addr-pais').value.trim();
                    if(!direccion){ alert('Dirección requerida para todas las entradas'); return; }
                    updates.push({addrId, direccion, poblacion, codigo_postal, pais});
                }

                const missingEndpoints = new Set();
                for(const u of updates){
                    try{
                        if(!u.addrId){
                            // new address -> use existing add endpoint
                            const res = await fetch('/api/addresses/add', {
                                method:'POST',
                                headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
                                body: new URLSearchParams({client_id: clientId, direccion: u.direccion, poblacion: u.poblacion, codigo_postal: u.codigo_postal, pais: u.pais}).toString()
                            });
                            if(!res.ok){ const txt = await res.text(); alert('Error añadiendo dirección: ' + (txt||res.status)); return; }
                        } else {
                            // existing address -> attempt update endpoint
                            const res = await fetch('/api/addresses/update', {
                                method:'POST',
                                headers:{'Content-Type':'application/json;charset=UTF-8'},
                                body: JSON.stringify({id: u.addrId, client_id: clientId, direccion: u.direccion, poblacion: u.poblacion, codigo_postal: u.codigo_postal, pais: u.pais})
                            });
                            if(res.status === 404){ missingEndpoints.add('/api/addresses/update'); }
                            else if(!res.ok){ const txt = await res.text(); alert('Error actualizando dirección: ' + (txt||res.status)); return; }
                        }
                    }catch(err){ alert('Error de red al guardar direcciones'); return; }
                }

                if(missingEndpoints.size>0){
                    placeholder.firstChild.insertAdjacentHTML('afterbegin', `<div class="error" style="margin-bottom:8px">El backend no dispone de los endpoints necesarios para actualizar direcciones. Falta: ${Array.from(missingEndpoints).join(', ')}. Para finalizar la funcionalidad, crea un endpoint POST /api/addresses/update que acepte JSON {id, client_id, direccion, poblacion, codigo_postal, pais} y actualice la fila correspondiente en <code>datos_envio</code>.</div>`);
                    return;
                }

                try{
                    const r2 = await fetch('/api/addresses?client_id=' + encodeURIComponent(clientId));
                    const updated = await r2.json();
                    addressesCache.set(clientId, updated);
                    placeholder.firstChild.innerHTML = renderAddressesList(updated);
                    attachAddAddressHandler(placeholder, clientId);
                    attachSaveAddressesHandler(placeholder, clientId);
                    attachDeleteAddressHandler(placeholder, clientId);
                }catch(err){ alert('No se pudo recargar la lista de direcciones'); }
            });
        }

        // Attach delete handlers for address delete buttons
        function attachDeleteAddressHandler(placeholder, clientId){
            const delBtns = Array.from(placeholder.firstChild.querySelectorAll('.delete-addr-btn'));
            delBtns.forEach(btn=>{
                if(btn.dataset.bound) return; btn.dataset.bound = '1';
                btn.addEventListener('click', async ()=>{
                    const id = btn.getAttribute('data-id');
                    if(!id){ alert('ID de dirección inválido'); return; }
                    if(!confirm('¿Eliminar esta dirección de envío? Esta acción no se puede deshacer.')) return;
                    try{
                        const res = await fetch('/api/addresses/delete', {
                            method: 'POST',
                            headers: {'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
                            body: new URLSearchParams({id}).toString()
                        });
                        const txt = await res.text();
                        if(!res.ok){ alert('Error eliminando dirección: ' + (txt || res.status)); return; }
                        // reload addresses
                        const r2 = await fetch('/api/addresses?client_id=' + encodeURIComponent(clientId));
                        const updated = await r2.json();
                        addressesCache.set(clientId, updated);
                        placeholder.firstChild.innerHTML = renderAddressesList(updated);
                        attachAddAddressHandler(placeholder, clientId);
                        attachSaveAddressesHandler(placeholder, clientId);
                        attachDeleteAddressHandler(placeholder, clientId);
                    }catch(err){ alert('No se pudo conectar al servidor'); }
                });
            });
        }

        // delegate address buttons (they are created when rendering)
        document.addEventListener('click', (ev)=>{
            const btn = ev.target.closest && ev.target.closest('.btn-addresses');
            if(!btn) return;
            const id = btn.getAttribute('data-id');
            const name = btn.getAttribute('data-name');
            toggleAddresses(btn, id, name);
        });
    </script>
</body>
</html>
