<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Productos</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <main class="card card--wide">
      <div class="module-header">
        <div class="badge">Productos</div>
        <div class="small">Listado</div>
      </div>

      <section>
        <div class="table-responsive">
          <table id="productsTable">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Código</th>
                <th>Planos</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <div style="margin-top: 12px">
        <button class="ghost" onclick="location.href='/dashboard'">
          Volver
        </button>
      </div>
    </main>

    <script>
      (async function () {
        const tbody = document.querySelector("#productsTable tbody");
        function escape(s) {
          if (s == null) return "";
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        async function load() {
          tbody.innerHTML =
            '<tr><td colspan="4" class="empty">Cargando...</td></tr>';
          try {
            const res = await fetch("/api/products?q=*");
            if (!res.ok) {
              tbody.innerHTML =
                '<tr><td colspan="4" class="empty">No se pudieron cargar los productos</td></tr>';
              return;
            }
            const rows = await res.json();
            if (!rows || rows.length === 0) {
              tbody.innerHTML =
                '<tr><td colspan="4" class="empty">No hay productos</td></tr>';
              return;
            }
            tbody.innerHTML = "";
            rows.forEach((p) => {
              if (p.planos == "No hay planos para este producto") {
                var planosLink = "<p>No hay planos para este producto</p>";
              } else if (p.planos) {
                var path = p.planos || p.planos_file || "";
                var nombreArchivo = path.split(/(\\|\/)/g).pop();
                var planos = p.planos || p.planos_file || "";
                var planosLink = planos
                  ? `<a href="${encodeURI(
                      "/pdf/planos/" + nombreArchivo
                    )}" target="_blank">Ver plano</a>`
                  : "—";
              } else {
                const planos = "—";
              }

              const tr = document.createElement("tr");
              tr.innerHTML = `
          <td>${escape(p.nombre || p.descripcion || p.name || "")}</td>
          <td>${escape(p.codigo || p.code || "")}</td>
          <td>${planosLink}</td>
          <td><button class="primary" onclick="viewProduct('${encodeURIComponent(
            p.idproducto || p.id || p.idproducto || p.codigo || p.nombre
          )}')">Ver</button></td>
        `;
              tbody.appendChild(tr);
            });
          } catch (e) {
            console.error(e);
            tbody.innerHTML =
              '<tr><td colspan="4" class="empty">Error cargando productos</td></tr>';
          }
        }

        window.viewProduct = function (id) {
          window.location.href = "/products/detail?id=" + id;
        };

        load();
      })();
    </script>
  </body>
</html>
