<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — App Gestión</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <main class="card">
        <h2 style="margin:0 0 6px 0">Iniciar sesión</h2>
        <p class="small" style="margin:0 0 12px 0">Introduce tu usuario y contraseña para acceder al dashboard.</p>

        <form action="/login" method="post">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" required autocomplete="username" />

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" />

            <div class="actions" style="margin-top:12px">
                <button type="submit" class="primary">Iniciar sesión</button>
            </div>
        </form>
    </main>
        <script src="/js/alerts.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function(){
                try{ Alerts.initSocket({ onConnect:()=>console.log('alerts connected'), onError:(e)=>console.warn('alerts error', e) }); }catch(e){ console.warn('Alerts init error', e); }
            });
        </script>
    </body>
    </html>
