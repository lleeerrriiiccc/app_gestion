<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — App Gestión</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <main class="card">
        <h2 style="margin:0 0 6px 0">Iniciar sesión</h2>
        <p class="small" style="margin:0 0 12px 0">Introduce tu usuario y contraseña para acceder al dashboard.</p>

        <form action="/login" method="post">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" required autocomplete="username" />

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" />

            <div style="display:flex;gap:10px;align-items:center;margin-top:6px">
                <button type="submit">Entrar</button>
                <a href="/register" style="margin-left:auto;color:#2563eb;text-decoration:none" class="small">Crear usuario</a>
            </div>
        </form>
    </main>
</body>
</html>
