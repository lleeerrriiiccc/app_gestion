<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Usuarios — Nuevo usuario</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <main class="card" role="main">
        <div class="module-header" aria-hidden="false">
            <div class="badge">Módulo Usuarios</div>
            <div style="font-size:13px;color:var(--muted)">Gestión · Crear nuevo</div>
        </div>

        <h1>Crear nuevo usuario</h1>
        <p class="lead">Utiliza este módulo para añadir usuarios al sistema de gestión. Los campos requeridos son usuario y contraseña.</p>

    <form id="loginForm" action="/register" method="post" novalidate>
            <div>
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" required autocomplete="username" placeholder="tu_usuario">
            </div>

            <div>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Al menos 8 caracteres">
            </div>

            <div>
                <label for="privilege">Privilegio</label>
                <select id="privilege" name="privilege">
                    <option value="0">Usuario</option>
                    <option value="1">Administrador</option>
                </select>
            </div>

            <div>
                <label for="department">Departamento</label>
                <select id="department" name="department">
                    <option value="">-- Seleccionar departamento --</option>
                </select>
            </div>

            <div class="actions">
                <button type="submit" class="primary">Crear usuario</button>
                <button type="button" class="ghost" onclick="location.href='/dashboard'" aria-label="Cancelar y volver al dashboard">Cancelar</button>
            </div>

            <div id="message" role="status" aria-live="polite"></div>
        </form>
    </main>

    <script>
        (function(){
            const form = document.getElementById('loginForm');
            const msg = document.getElementById('message');
            const submitBtn = form.querySelector('button[type="submit"]');

            function show(text, cls){
                msg.textContent = text;
                msg.className = cls;
            }

            form.addEventListener('submit', async function(e){
                e.preventDefault();
                show('', '');
                const user = form.username.value.trim();
                const pwd = form.password.value;
                const privilege = form.privilege.value;
                const department = form.department.value;

                if (!user) {
                    show('El usuario es obligatorio.', 'error');
                    form.username.focus();
                    return;
                }

                if (pwd.length < 8) {
                    show('La contraseña debe tener al menos 8 caracteres.', 'error');
                    form.password.focus();
                    return;
                }


                const url = 'http://127.0.0.1/users/add';
                const body = new URLSearchParams(new FormData(form)).toString();

                submitBtn.disabled = true;
                show('Procesando…', 'small');

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                        body: body
                    });

                    const ct = res.headers.get('Content-Type') || '';
                    let data = ct.includes('application/json') ? await res.json() : await res.text();

                    if (res.ok) {
                        show(typeof data === 'string' ? data : (data.message || 'Usuario creado correctamente.'), 'success');
                        // form.reset(); // descomentar si quieres limpiar el formulario al crear el usuario
                    } else {
                        show(typeof data === 'string' ? data : (data.error || 'Error al crear el usuario.'), 'error');
                    }
                } catch (err) {
                    show('No se pudo conectar con el servidor.', 'error');
                    console.error(err);
                } finally {
                    submitBtn.disabled = false;
                }
            });
        })();
        async function loadDepartments(){
            try{
                const res = await fetch('/api/departments');
                if(!res.ok) throw new Error('No se pudieron cargar los departamentos.');
                const data = await res.json();
                const select = document.getElementById('department');
                data.forEach(dept=>{
                    const option = document.createElement('option');
                    option.value = dept.iddept || dept.id || dept.ID;
                    option.textContent = dept.name || dept.nombre || option.value;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error(err);
            }
        }
        loadDepartments();
    </script>
        <script src="/js/alerts.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function(){
                try{ Alerts.initSocket({ onConnect:()=>console.log('alerts connected'), onError:(e)=>console.warn('alerts error', e) }); }catch(e){ console.warn('Alerts init error', e); }
            });
        </script>
</body>
</html>
