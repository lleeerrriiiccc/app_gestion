<!-- upload_fragment.html - invoice upload module included in dashboard -->
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Invoice - App Gestión</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<div class="card card--narrow" id="upload-module">
    <div class="module-header" aria-hidden="false">
        <div class="badge">Módulo Facturas</div>
        <div style="font-size:13px;color:var(--muted)">Subir factura · Guardar registro</div>
    </div>

    <h3 style="margin:0 0 8px 0">Subir factura</h3>
    <p class="small">Selecciona un archivo y completa los datos del cliente. El archivo se guardará en el servidor y se registrará en la base de datos.</p>

    <form id="uploadForm" enctype="multipart/form-data" style="margin-top:12px">
        <div>
            <label for="file">Archivo (PDF/JPG)</label>
            <input id="file" name="file" type="file" required accept=".pdf,image/*">
        </div>

        <div>
            <label for="client">Cliente</label>
            <input id="client" name="client" type="text" required placeholder="Nombre del cliente" autocomplete="off">
            <div id="suggestions" class="suggestion-content"></div>
        </div>

        <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="cliente@ejemplo.com">
            <div id="emailSuggestions" class="suggestion-content" style="margin-top:6px"></div>
        </div>

                <div>
                        <label for="pedido_num">Número de pedido (opcional)</label>
                        <div style="display:flex; gap:.5rem; align-items:center">
                            <input id="pedido_num" name="pedido_num" type="text" placeholder="Escribe número de pedido" autocomplete="off" style="min-width:180px">
                            <input id="pedido_id" name="pedido_id" type="hidden">
                            <div id="pedido-client" style="color:var(--muted); font-size:13px;"> </div>
                        </div>
                        <div id="pedido-suggestions" class="suggestion-content" style="margin-top:6px"></div>
                </div>



        <div style="margin-top:6px">
            <label><input type="checkbox" id="checkbox" name="checkbox"> Factura pendiente de pago</label>
        </div>

        <div class="actions" style="margin-top:10px">
            <button type="submit" class="primary">Subir y guardar</button>
            <button type="button" class="ghost" onclick="location.href='/dashboard'">Volver</button>
        </div>

        <div id="uploadMessage" role="status" aria-live="polite" style="margin-top:10px"></div>
    </form>
</div>

<script>
    (function(){
        const form = document.getElementById('uploadForm');
        const msg = document.getElementById('uploadMessage');
        const submitBtn = form.querySelector('button[type="submit"]');

        function show(text, cls){
            msg.textContent = text;
            msg.className = cls;
        }

        form.addEventListener('submit', async function(e){
            e.preventDefault();
            show('', '');

            const f = form.querySelector('#file').files[0];
            const client = form.client.value.trim();
            const email = form.email.value.trim();
            const checkbox = form.checkbox.checked ? 'on' : '';
            const pedido = form.pedido_num.value.trim();

            if (!f) { show('Selecciona un archivo.', 'error'); return; }
            if (!client) { show('El cliente es obligatorio.', 'error'); return; }

            const fd = new FormData();
            fd.append('file', f);
            fd.append('client', client);
            fd.append('email', email);
            fd.append('checkbox', checkbox);
            fd.append('pedido', pedido);

            submitBtn.disabled = true;
            show('Subiendo…', 'small');

            try {
                const res = await fetch('/invoices/add', {
                    method: 'POST',
                    body: fd
                });

                const ct = res.headers.get('Content-Type') || '';
                let data = ct.includes('application/json') ? await res.json() : await res.text();

                if (res.ok) {
                    show(typeof data === 'string' ? data : (data.message || 'Subida correcta.'), 'success');
                    // optionally reset
                    // form.reset();
                } else {
                    show(typeof data === 'string' ? data : (data.error || 'Error al subir.'), 'error');
                }
            } catch (err) {
                show('No se pudo conectar con el servidor.', 'error');
                console.error(err);
            } finally {
                submitBtn.disabled = false;
            }
        });

        // --- Autocomplete for client input ---
        const clientInput = document.getElementById('client');
        const suggestionsDiv = document.getElementById('suggestions');

        clientInput.addEventListener('input', function() {
            const data = this.value;
            if (data.length < 2) {
                suggestionsDiv.innerHTML = '';
                return;
            }
            fetch(`/data?data=${encodeURIComponent(data)}`)
                .then(r => r.json())
                .then(arr => {
                    suggestionsDiv.innerHTML = '';
                    const width = clientInput.offsetWidth;
                    suggestionsDiv.style.width = width + 'px';
                    arr.forEach(name => {
                        const div = document.createElement('div');
                        div.className = 'suggestion';
                        div.textContent = name;
                        suggestionsDiv.appendChild(div);
                    });
                })
                .catch(err => {
                    suggestionsDiv.innerHTML = '';
                    console.error(err);
                });
        });

        suggestionsDiv.addEventListener('click', function(e){
            if (e.target && e.target.classList.contains('suggestion')) {
                const chosen = e.target.textContent;
                clientInput.value = chosen;
                suggestionsDiv.innerHTML = '';
                // after selecting a client name, fetch client id and contacts to suggest invoice emails
                tryPopulateInvoiceEmails(chosen);
            }
        });

        // --- Autocomplete for pedido number ---
        const pedidoInput = document.getElementById('pedido_num');
        const pedidoIdHidden = document.getElementById('pedido_id');
        const pedidoClientSpan = document.getElementById('pedido-client');
        const pedidoSuggestionsDiv = document.getElementById('pedido-suggestions');
        let pedidosCache = null;
        let pedidoTimer = null;

        async function fetchAllPedidos(){
            if(pedidosCache) return pedidosCache;
            try{
                const r = await fetch('/api/pedidos');
                if(!r.ok) return [];
                const data = await r.json();
                // Expect items with 'idpedido' and 'cliente' fields
                pedidosCache = data || [];
                return pedidosCache;
            }catch(e){ console.error('fetchAllPedidos', e); return []; }
        }

        pedidoInput.addEventListener('input', function(){
            clearTimeout(pedidoTimer);
            pedidoIdHidden.value = '';
            pedidoClientSpan.textContent = '';
            const q = this.value.trim();
            if(!q){ pedidoSuggestionsDiv.innerHTML = ''; return; }
            pedidoTimer = setTimeout(async ()=>{
                // prefer numeric match, but we will filter strings too
                const all = await fetchAllPedidos();
                if(!all || all.length===0){ pedidoSuggestionsDiv.innerHTML = ''; return; }
                const filtered = all.filter(p=> String(p.idpedido).startsWith(q) || (p.cliente||'').toLowerCase().indexOf(q.toLowerCase())!==-1 ).slice(0,40);
                pedidoSuggestionsDiv.innerHTML = '';
                filtered.forEach(p=>{
                    const div = document.createElement('div');
                    div.className = 'suggestion';
                    div.dataset.payload = JSON.stringify(p);
                    div.textContent = `#${p.idpedido} — ${p.cliente || p.cliente_nombre || ''}`;
                    pedidoSuggestionsDiv.appendChild(div);
                });
            }, 200);
        });

        pedidoSuggestionsDiv.addEventListener('click', function(e){
            const it = e.target.closest('.suggestion');
            if(!it) return;
            let payload = null;
            try{ payload = JSON.parse(it.dataset.payload); }catch(e){ payload = null; }
            if(!payload) return;
            pedidoInput.value = String(payload.idpedido || payload.id || '');
            pedidoIdHidden.value = String(payload.idpedido || payload.id || '');
            pedidoClientSpan.textContent = payload.cliente || payload.cliente_nombre || '';
            pedidoSuggestionsDiv.innerHTML = '';
        });

        // On blur, clear suggestions shortly
        pedidoInput.addEventListener('blur', ()=> setTimeout(()=> pedidoSuggestionsDiv.innerHTML = '', 180));

        // Also try populate when client input loses focus and value matches a client
        clientInput.addEventListener('blur', function(){
            const val = this.value.trim();
            if(val) setTimeout(()=> tryPopulateInvoiceEmails(val), 200); // slight delay to allow click
        });

        const emailSuggestionsDiv = document.getElementById('emailSuggestions');

        function isInvoiceRecipient(contact){
            // some schemas mark this column as 'facturas' with 1/0 or '1'/'0'
            if(!contact) return false;
            const v = contact.facturas ?? contact.factura ?? contact.send_invoices ?? contact.send_invoice;
            if(v === undefined) return false;
            return v === 1 || v === '1' || v === 'on' || v === true;
        }

        async function tryPopulateInvoiceEmails(clientName){
            if(!clientName) return;
            try{
                // first get client record to resolve id
                const cRes = await fetch('/api/clients?name=' + encodeURIComponent(clientName));
                if(!cRes.ok) return;
                const clients = await cRes.json();
                if(!clients || clients.length === 0) return;
                const client = clients[0];
                const clientId = client.idcliente || client.id || client.idCliente || client.ID;
                if(!clientId) return;
                // fetch contacts for client
                const r = await fetch('/api/contacts?client_id=' + encodeURIComponent(clientId));
                if(!r.ok) return;
                const contacts = await r.json();
                // filter contacts marked as invoice recipients and unique emails
                const emails = [];
                const seen = new Set();
                (contacts || []).forEach(ct=>{
                    const email = ct.email || ct.mail || ct.e_mail || '';
                    if(!email) return;
                    if(!isInvoiceRecipient(ct)) return;
                    if(!seen.has(email)){
                        seen.add(email);
                        emails.push({email, name: ct.name || ct.nombre || ''});
                    }
                });
                renderEmailSuggestions(emails);
            }catch(err){ console.error('populate emails', err); }
        }

        function renderEmailSuggestions(list){
            emailSuggestionsDiv.innerHTML = '';
            if(!list || list.length === 0) return;
            list.forEach(it=>{
                const div = document.createElement('div');
                div.className = 'suggestion';
                div.textContent = it.email + (it.name ? ' — ' + it.name : '');
                div.dataset.email = it.email;
                emailSuggestionsDiv.appendChild(div);
            });
        }

        emailSuggestionsDiv.addEventListener('click', function(e){
            if(e.target && e.target.classList.contains('suggestion')){
                const email = e.target.dataset.email || e.target.textContent.split(' ')[0];
                document.getElementById('email').value = email;
                emailSuggestionsDiv.innerHTML = '';
            }
        });
    })();
</script>
